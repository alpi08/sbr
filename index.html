<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Seni Çok Seviyorum ♥</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #07030b;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block;
    transform-origin: center center;
    box-shadow: 0 0 80px rgba(255, 60, 110, 0.08);
    border-radius: 6px;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
(() => {
  "use strict";

  // ====================== AYARLAR ======================
  const W = 960, H = 900;
  const CX = W / 2, CY = H / 2;
  const BG = "#07030b";

  const WORDS = [
    "Seni çok seviyorum", "I love you", "Te amo", "Je t'aime",
    "Ich liebe dich", "Ti amo", "Eu te amo", "Я тебя люблю",
    "愛してる", "我爱你", "사랑해요", "أحبك",
    "मैं तुमसे प्यार करता हूँ", "Σ' αγαπώ", "אני אוהב אותך",
    "Ik hou van je", "Jag älskar dig", "Kocham cię",
    "Я тебе кохаю", "Minä rakastan sinua",
  ];

  const INNER_SIZE   = 11;   // iç dolgu — küçük ki sınır ince görünsün
  const OUTLINE_SIZE = 12;   // kontur — eğriye göre döndürülür
  const INNER_LH     = Math.round(INNER_SIZE  * 1.15);
  const OUTLINE_LH   = Math.round(OUTLINE_SIZE * 1.15);
  const INNER_FAM    = "Helvetica, Arial, sans-serif";
  const OUTLINE_FAM  = "Georgia, 'Times New Roman', serif";

  // ====================== KANVAS ======================
  const cv = document.getElementById("cv");
  cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");

  function fitCanvas() {
    const s = Math.min(1, window.innerWidth / W, window.innerHeight / H);
    cv.style.transform = `scale(${s})`;
  }
  window.addEventListener("resize", fitCanvas);
  fitCanvas();

  // ====================== KALP EĞRİSİ ======================
  function heartXY(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t)
              - 2 * Math.cos(3*t) - Math.cos(4*t));
    return [x, y];
  }

  const HEART_CY = 3.0;
  const SCALE    = 21.0;
  const N_SAMPLES = 6000;

  const ptsScreen = [];
  for (let i = 0; i <= N_SAMPLES; i++) {
    const [hx, hy] = heartXY(2 * Math.PI * i / N_SAMPLES);
    ptsScreen.push([CX + hx * SCALE, CY + (hy - HEART_CY) * SCALE]);
  }

  // Satır başına iç segmentler (dedup = 2 → tepe çentiği korunur)
  const rowXs = new Map();
  for (const [sx, sy] of ptsScreen) {
    const yb = Math.round(sy);
    if (!rowXs.has(yb)) rowXs.set(yb, []);
    rowXs.get(yb).push(sx);
  }
  const insideSegments = new Map();
  for (const [yb, xs] of rowXs) {
    xs.sort((a, b) => a - b);
    const dedup = [];
    for (const x of xs) {
      if (!dedup.length || x - dedup[dedup.length - 1] > 2) dedup.push(x);
    }
    if (dedup.length % 2 === 1) dedup.pop();
    const segs = [];
    for (let i = 0; i < dedup.length; i += 2) {
      if (dedup[i+1] - dedup[i] > 10) segs.push([dedup[i], dedup[i+1]]);
    }
    if (segs.length) insideSegments.set(yb, segs);
  }
  const yKeys = [...insideSegments.keys()];
  const yMin = Math.min(...yKeys);
  const yMax = Math.max(...yKeys);

  function segmentsAt(y) {
    const yb = Math.round(y);
    for (const d of [0, 1, -1, 2, -2, 3, -3, 4, -4]) {
      const s = insideSegments.get(yb + d);
      if (s) return s;
    }
    return [];
  }

  // Yay uzunluğu
  const cum = [0];
  for (let i = 1; i < ptsScreen.length; i++) {
    cum.push(cum[i-1] + Math.hypot(
      ptsScreen[i][0] - ptsScreen[i-1][0],
      ptsScreen[i][1] - ptsScreen[i-1][1]));
  }
  const TOTAL = cum[cum.length - 1];

  function posAtArc(a) {
    a = ((a % TOTAL) + TOTAL) % TOTAL;
    let lo = 0, hi = cum.length - 1;
    while (lo < hi - 1) {
      const mid = (lo + hi) >> 1;
      if (cum[mid] < a) lo = mid; else hi = mid;
    }
    const seg = cum[hi] - cum[lo];
    if (seg < 1e-6) return ptsScreen[lo];
    const t = (a - cum[lo]) / seg;
    return [
      ptsScreen[lo][0] + (ptsScreen[hi][0] - ptsScreen[lo][0]) * t,
      ptsScreen[lo][1] + (ptsScreen[hi][1] - ptsScreen[lo][1]) * t,
    ];
  }

  // ====================== ÖLÇÜM & ÇAKIŞMA ======================
  function measure(text, size, italic, bold, family) {
    ctx.font = `${italic ? "italic " : ""}${bold ? "bold " : ""}${size}px ${family}`;
    return ctx.measureText(text).width;
  }

  function rectsCollide(a, b, pad = 0) {
    return !(a[2] + pad < b[0] || a[0] - pad > b[2] ||
             a[3] + pad < b[1] || a[1] - pad > b[3]);
  }

  function rotatedAABB(cx, cy, w, h, angle) {
    const cos = Math.cos(angle), sin = Math.sin(angle);
    const hw = w/2, hh = h/2;
    const cs = [[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]].map(([x,y]) =>
      [cx + x*cos - y*sin, cy + x*sin + y*cos]);
    return [
      Math.min(cs[0][0], cs[1][0], cs[2][0], cs[3][0]),
      Math.min(cs[0][1], cs[1][1], cs[2][1], cs[3][1]),
      Math.max(cs[0][0], cs[1][0], cs[2][0], cs[3][0]),
      Math.max(cs[0][1], cs[1][1], cs[2][1], cs[3][1]),
    ];
  }

  // ====================== YERLEŞTİRME ======================
  const items = [];
  const occupied = [];

  // --- Kontur: eğriye göre döndürülmüş, pürüzsüz yazı şeridi ---
  let outlineCount = 0;
  let arc = 0;
  while (arc < TOTAL - 90) {
    const word = WORDS[outlineCount % WORDS.length];
    const w = measure(word, OUTLINE_SIZE, true, false, OUTLINE_FAM);
    const midArc = arc + w/2 + 2;
    if (midArc >= TOTAL) break;

    const [ccx, ccy] = posAtArc(midArc);
    const [nx, ny] = posAtArc(midArc + 4);
    const [qx, qy] = posAtArc(midArc - 4);
    let angle = Math.atan2(ny - qy, nx - qx);
    if (angle >  Math.PI / 2) angle -= Math.PI;
    if (angle < -Math.PI / 2) angle += Math.PI;

    const aabb = rotatedAABB(ccx, ccy, w + 1, OUTLINE_LH + 1, angle);

    const dx = ccx - CX, dy = ccy - CY;
    const d = Math.hypot(dx, dy) || 1;
    items.push({
      px: ccx, py: ccy, angle,
      sx: ccx + (dx/d) * 500,
      sy: ccy + (dy/d) * 500,
      word,
      appear: 0.25 + (arc / TOTAL) * 2.0,
      dur: 0.8,
      kind: "outline",
      seed: Math.random(),
    });
    occupied.push(aabb);
    outlineCount++;
    arc += w + 3;
  }

  // --- İç dolgu: sıkı, çakışmasız ---
  const innerPlaced = [];
  let wordIdx = 0;
  const rowStep = INNER_LH + 1;

  let y = yMin + 18;
  while (y < yMax - 10) {
    for (const [xa, xb] of segmentsAt(y)) {
      if (xb - xa < 30) continue;
      let x = xa + 4;
      while (x < xb - 4) {
        let placed = false;
        for (let attempt = 0; attempt < WORDS.length; attempt++) {
          const word = WORDS[(wordIdx + attempt) % WORDS.length];
          const w = measure(word, INNER_SIZE, false, true, INNER_FAM);
          if (x + w + 1 > xb - 2) continue;
          const ccx = x + w / 2;
          const rect = [ccx - w/2 - 0.5, y - INNER_LH/2 - 0.5,
                        ccx + w/2 + 0.5, y + INNER_LH/2 + 0.5];
          let collide = false;
          for (const r of occupied) if (rectsCollide(rect, r, 0)) { collide = true; break; }
          if (collide) continue;
          innerPlaced.push([ccx, y, word]);
          occupied.push(rect);
          wordIdx += attempt + 1;
          x += w + 1;
          placed = true;
          break;
        }
        if (!placed) x += 2;
      }
    }
    y += rowStep;
  }

  // Görünme zamanı — merkezden dışa
  if (innerPlaced.length) {
    let maxD = 1;
    for (const [px, py] of innerPlaced) {
      const d = Math.hypot(px - CX, py - CY);
      if (d > maxD) maxD = d;
    }
    for (const [px, py, word] of innerPlaced) {
      const d = Math.hypot(px - CX, py - CY);
      const appearT = 2.3 + (d / maxD) * 1.7;
      const ang = Math.random() * Math.PI * 2;
      const off = 50 + Math.random() * 90;
      items.push({
        px, py,
        sx: px + Math.cos(ang) * off,
        sy: py + Math.sin(ang) * off,
        word, appear: appearT, dur: 0.5,
        kind: "inner", seed: Math.random(),
      });
    }
  }

  items.sort((a, b) => a.appear - b.appear);
  console.log("Kontur:", outlineCount, "| İç:", innerPlaced.length,
              "| Toplam:", items.length);

  // ====================== ARKA PLAN KALPLERİ ======================
  const floatHearts = [];
  for (let i = 0; i < 80; i++) {
    floatHearts.push({
      x: Math.random() * W, y: Math.random() * H,
      size: 2.5 + Math.random() * 5.5,
      vy: -(0.18 + Math.random() * 0.37),
      hue: [0.97, 1.0, 0.92, 0.85, 0.05][Math.floor(Math.random() * 5)],
      phase: Math.random() * Math.PI * 2,
    });
  }

  // ====================== RENK ======================
  function hsvToHex(h, s, v) {
    h = ((h % 1) + 1) % 1;
    const i = Math.floor(h * 6), f = h * 6 - i;
    const p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
    let r, g, b;
    switch (i % 6) {
      case 0: r=v; g=t; b=p; break;
      case 1: r=q; g=v; b=p; break;
      case 2: r=p; g=v; b=t; break;
      case 3: r=p; g=q; b=v; break;
      case 4: r=t; g=p; b=v; break;
      default: r=v; g=p; b=q;
    }
    const hx = x => Math.round(Math.max(0, Math.min(255, x * 255)))
                          .toString(16).padStart(2, "0");
    return "#" + hx(r) + hx(g) + hx(b);
  }

  function hexToRgb(c) {
    return [parseInt(c.slice(1,3),16),
            parseInt(c.slice(3,5),16),
            parseInt(c.slice(5,7),16)];
  }

  function lerpColor(c1, c2, t) {
    t = Math.max(0, Math.min(1, t));
    const a = hexToRgb(c1), b = hexToRgb(c2);
    return "#" + [0,1,2].map(i =>
      Math.round(a[i] + (b[i] - a[i]) * t)
        .toString(16).padStart(2, "0")).join("");
  }

  function drawSmallHeart(x, y, size, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    const n = 10;
    for (let i = 0; i < n; i++) {
      const tt = 2 * Math.PI * i / n;
      const hx = 16 * Math.pow(Math.sin(tt), 3);
      const hy = -(13 * Math.cos(tt) - 5 * Math.cos(2*tt)
                 - 2 * Math.cos(3*tt) - Math.cos(4*tt));
      const px = x + hx * size / 16;
      const py = y + hy * size / 16;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
  }

  // ====================== ANİMASYON ======================
  const startTime = performance.now();

  function animate(now) {
    const elapsed = (now - startTime) / 1000;

    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    const beat = (elapsed * 1.15) % 1;
    let pulse = 1.0;
    if (beat < 0.12)       pulse += 0.05  * Math.sin((beat / 0.12) * Math.PI);
    else if (beat < 0.30)  pulse += 0.035 * Math.sin(((beat - 0.12) / 0.18) * Math.PI);

    for (let k = 0; k < 6; k++) {
      const rr = (250 - k * 32) * (1 + 0.03 * Math.sin(elapsed * 1.1));
      ctx.fillStyle = hsvToHex(0.96, 0.75, 0.012 + k * 0.004);
      ctx.beginPath();
      ctx.ellipse(CX, CY + rr * 0.1, rr, rr, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    for (const hh of floatHearts) {
      hh.y += hh.vy;
      if (hh.y < -25) { hh.y = H + 25; hh.x = Math.random() * W; }
      const tw = 0.55 + 0.45 * Math.sin(elapsed * 1.6 + hh.phase);
      drawSmallHeart(hh.x, hh.y, hh.size,
                     hsvToHex(hh.hue, 0.55, 0.16 + 0.28 * tw));
    }

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    for (const it of items) {
      const raw = (elapsed - it.appear) / it.dur;
      if (raw <= 0) continue;
      const p = Math.min(1, raw);
      const ease = 1 - Math.pow(1 - p, 3);

      let fx = it.sx + (it.px - it.sx) * ease;
      let fy = it.sy + (it.py - it.sy) * ease;
      fx = CX + (fx - CX) * pulse;
      fy = CY + (fy - CY) * pulse;

      if (p >= 1) {
        fx += Math.sin(elapsed * 1.4 + it.seed * 10) * 1.5;
        fy += Math.cos(elapsed * 1.1 + it.seed * 10) * 1.5;
      }

      const hue = ((0.97 + 0.05 * Math.sin(elapsed * 0.4 + it.seed * 6.28)) % 1 + 1) % 1;

      if (it.kind === "outline") {
        // Kontur: daha parlak, teğete göre döndürülmüş
        const target = hsvToHex(hue, 0.72, 1.0);
        ctx.fillStyle = lerpColor("#1a0208", target, p);
        ctx.save();
        ctx.translate(fx, fy);
        ctx.rotate(it.angle);
        ctx.font = `italic ${OUTLINE_SIZE}px ${OUTLINE_FAM}`;
        ctx.fillText(it.word, 0, 0);
        ctx.restore();
      } else {
        // İç dolgu: daha sönük
        const target = hsvToHex(hue, 0.55, 0.85);
        ctx.fillStyle = lerpColor("#1a0208", target, p);
        ctx.font = `bold ${INNER_SIZE}px ${INNER_FAM}`;
        ctx.fillText(it.word, fx, fy);
      }
    }

    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
